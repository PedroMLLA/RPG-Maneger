<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visão dos Jogadores - RPG Manager</title>
    <link rel="icon" href="icone.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">

    <!-- Jogador que entrou pelo código (V3): os dados vêm do Supabase.
         Aqui não tem sessao.js: esta página não exige login de mestre. -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="js/supabase.js"></script>
</head>
<body class="visao-jogadores">

    <!-- Só o mapa e os tokens: nenhum controle do mestre aparece aqui -->
    <main id="mapa-jogadores">

        <div id="conteudo-mapa">
            <img id="imagem-mapa" src="" alt="Mapa">
            <!-- Imagens que o mestre colocou no mapa -->
            <div id="imagens-mapa"></div>
            <div id="personagens-mapa"></div>
        </div>

        <div id="vez-jogadores">Aguardando a batalha...</div>

        <!-- Vida e sanidade dos aliados que o mestre liberou (inimigos nunca aparecem aqui) -->
        <aside id="grupo-jogadores"></aside>

        <!-- Coluna da direita: inventários e habilidades que o mestre liberou -->
        <aside id="inventarios-jogadores"></aside>

        <!-- Só no celular: botões que abrem a vida e os itens numa gaveta
             (no PC os painéis já ficam sempre nas laterais) -->
        <nav id="botoes-paineis">
            <button type="button" class="botao-painel" data-painel="grupo" hidden>❤ Grupo</button>
            <button type="button" class="botao-painel" data-painel="itens" hidden>🎒 Itens</button>
        </nav>

        <!-- Fichas que o mestre liberou: aparecem no centro, por cima do mapa -->
        <div id="fichas-jogadores"></div>

        <!-- Anúncio em tela cheia (ex.: "Nero está morrendo") -->
        <div id="anuncio-jogadores" class="anuncio" aria-live="assertive">
            <span class="anuncio-titulo"></span>
            <span class="anuncio-texto"></span>
        </div>

    </main>

    <script src="js/armazenamento.js"></script>
    <script src="js/campanha-atual.js"></script>
    <script src="js/tokens.js"></script>
    <script src="js/ficha.js"></script>
    <script src="js/anuncios.js"></script>
    <script src="js/peso.js"></script>
    <script src="js/jogador.js"></script>
</body>
</html>
