<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escolher campanha - RPG Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="botao-voltar">← Início</a>
        <h1><span class="marca">RPG</span> Manager</h1>
    </header>

<main class="pagina-campanhas">

    <div class="fundo-inicio" aria-hidden="true"></div>

    <span class="selo-inicio adesivo">Escolha a campanha</span>

    <!-- A roda: as campanhas são colocadas em círculo pelo campanhas.js.
         O botão de adicionar fica no meio. -->
    <div id="roda-campanhas">
        <div class="anel-roda" aria-hidden="true"></div>

        <button id="botao-nova-campanha" title="Adicionar campanha">
            <span class="mais">+</span>
            <span>Nova campanha</span>
        </button>
    </div>

    <!-- Nome da campanha embaixo da roda, enquanto o mouse está em cima -->
    <p id="nome-em-destaque">Passe o mouse em uma campanha</p>

</main>

    <!-- Janela para criar uma campanha: nome + imagem -->
    <div id="janela-campanha" class="janela-modal">
        <div class="caixa-inventario">

            <h2>✦ Nova campanha</h2>

            <div class="campos-campanha">
                <input type="text" id="nome-campanha" placeholder="Nome (ex.: A Queda de Kotto)" maxlength="40">

                <label for="imagem-campanha" class="escolher-imagem-campanha">
                    <img id="previa-campanha" alt="" hidden>
                    <span id="texto-imagem-campanha">🖼️ Escolher imagem</span>
                </label>
                <input type="file" id="imagem-campanha" accept="image/*" hidden>
            </div>

            <div class="acoes-inventario">
                <button id="botao-cancelar-campanha">Cancelar</button>
                <button id="botao-criar-campanha" class="botao-salvar">Criar</button>
            </div>

        </div>
    </div>

    <script src="js/armazenamento.js"></script>
    <script src="js/campanha-atual.js"></script>
    <script src="js/imagens.js"></script>
    <script src="js/campanhas.js"></script>
</body>
</html>
