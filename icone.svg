<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Ícone da aba do navegador: um d20 nas cores do site -->
  <rect width="64" height="64" rx="14" fill="#0b0b0b"/>

  <!-- Contorno do dado (hexágono) -->
  <polygon points="32,6 54,19 54,45 32,58 10,45 10,19"
           fill="#e31e24" stroke="#ff3b40" stroke-width="2" stroke-linejoin="round"/>

  <!-- Face da frente (triângulo) e as arestas até as pontas -->
  <polygon points="32,19 46,41 18,41" fill="#b5151a" stroke="#ede8df" stroke-width="2" stroke-linejoin="round"/>
  <g stroke="#ede8df" stroke-width="2" stroke-linecap="round">
    <line x1="32" y1="6"  x2="32" y2="19"/>
    <line x1="54" y1="19" x2="46" y2="41"/>
    <line x1="10" y1="19" x2="18" y2="41"/>
    <line x1="54" y1="45" x2="46" y2="41"/>
    <line x1="10" y1="45" x2="18" y2="41"/>
    <line x1="32" y1="58" x2="46" y2="41"/>
    <line x1="32" y1="58" x2="18" y2="41"/>
    <line x1="10" y1="19" x2="32" y2="19"/>
    <line x1="54" y1="19" x2="32" y2="19"/>
  </g>
</svg>
