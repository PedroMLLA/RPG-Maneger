<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - RPG Manager</title>
    <link rel="icon" href="icone.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="botao-voltar">← Início</a>
        <h1><span class="marca">RPG</span> Manager</h1>
    </header>

<main class="pagina-login">

    <div class="fundo-inicio" aria-hidden="true"></div>

    <!-- Mesmo visual das janelas (inventário, ficha...) -->
    <form id="formulario-login" class="caixa-inventario caixa-login">

        <span class="selo-inicio adesivo">Área do mestre</span>

        <h2 id="titulo-login">Entrar</h2>

        <label for="email-login">E-mail</label>
        <input type="email" id="email-login" autocomplete="email" required>

        <label for="senha-login">Senha</label>
        <input type="password" id="senha-login" autocomplete="current-password" minlength="6" required>

        <!-- Erros e avisos (ex.: "senha errada", "confirme seu e-mail") -->
        <p id="mensagem-login" class="mensagem-login" role="alert" hidden></p>

        <button type="submit" id="botao-entrar" class="botao-salvar">Entrar</button>

        <p class="trocar-modo">
            <span id="texto-trocar-modo">Primeira vez aqui?</span>
            <button type="button" id="botao-trocar-modo" class="botao-link">Criar conta</button>
        </p>

    </form>

</main>

    <!-- Biblioteca do Supabase (versão fixa, para não mudar sozinha) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/login.js"></script>
    <!-- Enfeites de Natal (para tirar depois: apague esta linha) -->
    <script src="js/natal.js"></script>
</body>
</html>
