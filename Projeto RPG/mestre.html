<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel do Mestre - RPG Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="painel-mestre">

        <h2>⚔️ Painel do Mestre</h2>

        <h3>Inimigos</h3>

        <button id="botao-criar-inimigo">+ Criar inimigo</button>

<div id="formulario-inimigo" style="display: none;">

    <input type="text" id="nome-inimigo" placeholder="Nome">

    <input type="number" id="hp-inimigo" placeholder="HP" min="1">

    <label for="imagem-inimigo">Imagem:</label>

        <input type="file" id="imagem-inimigo" accept=".png,image/png">

    <label for="tamanho-inimigo">Tamanho:</label>

<select id="tamanho-inimigo">
    <option value="pequeno">Pequeno</option>
    <option value="medio">Médio</option>
    <option value="grande">Grande</option>
    <option value="muito-grande">Muito grande</option>
    <option value="enorme">Enorme</option>
</select>

    <button id="confirmar-inimigo">
        Criar
    </button>

</div>

        <div id="lista-inimigos-mestre"></div>

    </div>


    <script src="js/imagens.js"></script>
    <script src="js/mestre.js"></script>

</body>

</html>
